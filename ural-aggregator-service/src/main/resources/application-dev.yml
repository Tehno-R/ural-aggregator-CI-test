server:
  port: 10902

spring:
  application:
    name: ural-aggregator
    version: @project.version@
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18081/realms/ural

security:
  jwt:
    custom-decoder: false

proxy:
  cargo:
    url: http://localhost:10903
  users:
    url: http://localhost:10904
  auth:
    url: http://localhost:10901

logging:
  level:
    root: info
    org:
      springframework: INFO
      hibernate: INFO
      apache:
        tomcat:
          util: WARN
